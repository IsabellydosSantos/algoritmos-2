<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre de Hanói - Dica Inteligente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🏰 Torre de Hanói</h1>
        <div class="timer-float" id="cronometro">00:00:00</div>
        <div class="subtitle">Clique em uma haste para selecionar, depois em outra para mover</div>

        <div class="game-info">
            <div class="info-card">
                <h3>🎯 Movimentos</h3>
                <div class="value" id="moveCount">0</div>
            </div>
            <div class="info-card">
                <h3>⭐ Movimentos Mínimos</h3>
                <div class="value" id="minMoves">0</div>
            </div>
            <div class="info-card">
                <h3>💿 Discos</h3>
                <div class="value" id="diskCount">0</div>
            </div>
        </div>

        <div class="disk-config">
            <div class="config-group">
                <label for="diskSelector">Número de Discos (1-8):</label>
                <input type="number" id="diskSelector" min="1" max="8" value="3">
                <button id="applyDiscsBtn" class="btn-apply">Aplicar</button>
            </div>
        </div>

        <div id="victoryArea"></div>

        <div class="hanoi-container" id="hanoiContainer">
        </div>

        <div class="controls">
            <button class="btn-hint" id="hintBtn">💡 Dica</button>
            <button class="btn-new" id="newGameBtn">🎮 Novo Jogo</button>
            <button class="btn-reset" id="resetGameBtn">🔄 Resetar</button>
        </div>

        <div id="messageArea" class="message-area"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
